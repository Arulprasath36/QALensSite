<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Lens | Open Source</title>
  <script>
    fetch("/index.html").then((response) => response.text()).then((html) => {
      document.open();
      document.write(html.replace("<head>", "<head><base href=\"/\">"));
      document.close();
    });
  </script>
</head>
<body>
  <p><a href="/">Open QA Lens</a></p>
</body>
</html>
